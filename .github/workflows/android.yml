name: HomePilot Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

# Prevent two builds from publishing over the same 'latest' APKs at once.
concurrency:
  group: homepilot-apk-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9 einrichten und Abhängigkeiten cachen
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4

      # Cache SDK platforms/build-tools so sdkmanager does not have to
      # download the same Android packages on every clean GitHub runner.
      - name: Android SDK Pakete cachen
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platform-tools
            ${{ env.ANDROID_HOME }}/platforms/android-35
            ${{ env.ANDROID_HOME }}/build-tools/35.0.0
          key: android-sdk-${{ runner.os }}-platform-35-build-tools-35.0.0-v1

      - name: Android SDK Pakete installieren
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Stabilen Signaturschlüssel aus GitHub Secret einrichten
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$DEBUG_KEYSTORE_BASE64" || { echo "GitHub Secret DEBUG_KEYSTORE_BASE64 fehlt"; exit 1; }
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > .github/debug-keystore
          cp .github/debug-keystore "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore" .github/debug-keystore
          sha256sum .github/debug-keystore

      - name: Installierbare Release APK bauen
        run: gradle --no-daemon assembleRelease

      - name: APK-Paket, Version und Signatur prüfen
        run: |
          echo 'Release APK manifest:'
          $ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer manifest application-id app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer manifest version-code app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer manifest version-name app/build/outputs/apk/release/app-release.apk
          echo 'Release APK certificate:'
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: APKs als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: HomePilot-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: APK für direkten Download vorbereiten
        run: cp app/build/outputs/apk/release/app-release.apk HomePilot.apk

      - name: Neueste APKs als GitHub-Release bereitstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: HomePilot – neueste Version
          body: |
            HomePilot.apk ist die normale HomePilot-Version.
            HomePilot-Version: 1.29.11
          files: |
            HomePilot.apk
          overwrite_files: true
          make_latest: true
