name: HomePilot Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

# Prevent two builds from publishing over the same 'latest' APKs at once.
concurrency:
  group: homepilot-apk-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4

      - name: Android SDK Pakete installieren
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9 installieren
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Stabilen Debug-Signaturschlüssel einrichten
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode .github/debug-keystore.b64 > "$HOME/.android/debug.keystore"
          base64 --decode .github/debug-keystore.b64 > .github/debug-keystore
          chmod 600 "$HOME/.android/debug.keystore" .github/debug-keystore
          sha256sum .github/debug-keystore

      - name: Installierbare Release APK bauen
        run: gradle --no-daemon assembleRelease

      - name: Separate Test-App bauen
        run: gradle --no-daemon assembleDebug

      - name: APK-Paket, Version und Signatur prüfen
        run: |
          echo 'Release APK manifest:'
          $ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer manifest application-id app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer manifest version-code app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer manifest version-name app/build/outputs/apk/release/app-release.apk
          echo 'Release APK certificate:'
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk
          echo 'Test APK manifest:'
          $ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer manifest application-id app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer manifest version-code app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer manifest version-name app/build/outputs/apk/debug/app-debug.apk
          echo 'Test APK certificate:'
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: APKs als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: HomePilot-release-und-test-apks
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: APKs für direkten Download vorbereiten
        run: |
          cp app/build/outputs/apk/release/app-release.apk HomePilot.apk
          cp app/build/outputs/apk/debug/app-debug.apk HomePilot-Test.apk

      - name: Neueste APKs als GitHub-Release bereitstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: HomePilot – neueste Version
          body: |
            HomePilot.apk ist die normale Version.
            HomePilot-Test.apk ist eine separate Test-App und kann parallel installiert werden.
          files: |
            HomePilot.apk
            HomePilot-Test.apk
          overwrite_files: true
          make_latest: true
