name: HomePilot Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4

      - name: Android SDK Pakete installieren
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9 installieren
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Debug APK bauen
        working-directory: HomePilot
        run: gradle --no-daemon assembleDebug

      - name: APK als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: HomePilot-debug-apk
          path: HomePilot/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
