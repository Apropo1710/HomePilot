name: HomePilot Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: homepilot-apk-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9 einrichten und Abhängigkeiten cachen
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4

      - name: Android SDK Pakete cachen
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platform-tools
            ${{ env.ANDROID_HOME }}/platforms/android-35
            ${{ env.ANDROID_HOME }}/build-tools/35.0.0
          key: android-sdk-${{ runner.os }}-platform-35-build-tools-35.0.0-v1

      - name: Android SDK Pakete installieren
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Stabilen Signaturschlüssel aus GitHub Secret einrichten
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$DEBUG_KEYSTORE_BASE64" || { echo "GitHub Secret DEBUG_KEYSTORE_BASE64 fehlt"; exit 1; }
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > .github/debug-keystore
          cp .github/debug-keystore "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore" .github/debug-keystore
          sha256sum .github/debug-keystore

      - name: Installierbare Release APK bauen
        run: gradle --no-daemon assembleRelease

      - name: APK für Nutzer benennen
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/HomePilot.apk

      - name: APK-Paket, Version und Signatur prüfen
        run: |
          APK="app/build/outputs/apk/release/HomePilot.apk"
          echo 'Release APK manifest:'
          $ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer manifest application-id "$APK"
          $ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer manifest version-code "$APK"
          $ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer manifest version-name "$APK"
          echo 'Release APK certificate:'
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs "$APK"

      - name: APKs als Download bereitstellen
        if: github.event_name == 'workflow_dispatch'
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomePilot-release-apk
          path: app/build/outputs/apk/release/HomePilot.apk
          if-no-files-found: error
          retention-days: 1

      - name: Projektstatus mit verifizierten Build-Daten aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME=$(grep -oE 'versionName[[:space:]]*=[[:space:]]*"[^"]+"' app/build.gradle.kts | head -n 1 | cut -d '"' -f2)
          VERSION_CODE=$(grep -oE 'versionCode[[:space:]]*=[[:space:]]*[0-9]+' app/build.gradle.kts | head -n 1 | grep -oE '[0-9]+')
          APK="app/build/outputs/apk/release/HomePilot.apk"
          APK_SHA=$(sha256sum "$APK" | awk '{print $1}')
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            ARTIFACT_JSON=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts")
            ARTIFACT_ID=$(echo "$ARTIFACT_JSON" | jq -r '.artifacts[] | select(.name=="HomePilot-release-apk") | .id' | head -n 1)
            ARTIFACT_SIZE=$(echo "$ARTIFACT_JSON" | jq -r '.artifacts[] | select(.name=="HomePilot-release-apk") | .size_in_bytes' | head -n 1)
            test -n "$ARTIFACT_ID" && test "$ARTIFACT_ID" != "null"
            ARTIFACT_STATUS="HomePilot-release-apk, ID $ARTIFACT_ID, $ARTIFACT_SIZE Bytes (manueller Build)"
          else
            ARTIFACT_STATUS="kein Actions-Artefakt; APK wird im GitHub-Release latest veröffentlicht"
          fi
          export VERSION_NAME VERSION_CODE APK_SHA ARTIFACT_STATUS
          git fetch origin main
          git reset --soft origin/main
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path("PROJECT_STATUS.md")
          old = p.read_text()
          start = "<!-- AUTO-PRODUCTION-STATUS:START -->"
          end = "<!-- AUTO-PRODUCTION-STATUS:END -->"
          block = f"""<!-- AUTO-PRODUCTION-STATUS:START -->
          ## Automatisch gepflegter Produktionsstatus

          - Quellcommit des APK-Builds: {os.environ['GITHUB_SHA']}
          - App-Version / versionCode: **{os.environ['VERSION_NAME']} / {os.environ['VERSION_CODE']}**
          - Build-Zeit: {os.popen("date -u +'%Y-%m-%d %H:%M:%S UTC'").read().strip()}
          - APK-Dateiname: **HomePilot.apk**
          - APK-Signaturprüfung: erfolgreich (apksigner verify --print-certs)
          - Build-Artefakt: {os.environ['ARTIFACT_STATUS']}
          - APK-SHA-256: {os.environ['APK_SHA']}
          - GitHub-Release: Veröffentlichung wird in diesem Workflow nach dem Statuscommit abgeschlossen.
          - Smartphone-Test: **nicht durch CI geprüft**; nur separat bestätigte Nutzerberichte gelten als Gerätetest.
          - ChatGPT-Bibliotheksakte: separate Langzeit-/Historienakte; wird durch diesen Workflow nicht verändert.

          <!-- AUTO-PRODUCTION-STATUS:END -->"""
          if start in old and end in old:
              a = old.index(start)
              b = old.index(end, a) + len(end)
              old = old[:a] + block + old[b:]
          else:
              old = block + "\n\n" + old
          import re
          for heading in ("Aktueller Produktionsstand", "Build und Veröffentlichung"):
              pattern = rf"(?ms)^## {re.escape(heading)}\n.*?(?=^## |\\Z)"
              note = (
                  f"## {heading}\n\n"
                  "Die verbindlichen aktuellen Build-, Signatur-, Artefakt- und Release-Daten "
                  "stehen im automatisch gepflegten Produktionsstatus am Dokumentanfang. "
                  "Ältere Einzelstände werden nicht als aktueller Produktionsstand fortgeführt.\n\n"
              )
              old, _ = re.subn(pattern, note, old, count=1)
          p.write_text(old.rstrip() + "\\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh generated production status [skip ci]"
            git push origin HEAD:main
          fi

      - name: Git-Tag latest auf dokumentierten Produktionsstand setzen
        run: |
          git fetch origin main
          git tag -f latest origin/main
          git push origin refs/tags/latest --force

      - name: Neueste APK im GitHub-Release bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME=$(grep -oE 'versionName[[:space:]]*=[[:space:]]*"[^"]+"' app/build.gradle.kts | head -n 1 | cut -d '"' -f2)
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "HomePilot – neueste Version" --notes "HomePilot-Version: $VERSION_NAME
          Automatisch gebaut und geprüft. Quellstand: $(git rev-parse origin/main)."
          else
            gh release create latest --title "HomePilot – neueste Version" --notes "HomePilot-Version: $VERSION_NAME"
          fi
          gh release delete-asset latest app-release.apk --yes 2>/dev/null || true
          gh release upload latest app/build/outputs/apk/release/HomePilot.apk --clobber

      - name: Veröffentlichung im Produktionsstatus bestätigen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git reset --soft origin/main
          python3 - <<'PY'
          from pathlib import Path
          p = Path("PROJECT_STATUS.md")
          text = p.read_text()
          text = text.replace(
              "- GitHub-Release: Veröffentlichung wird in diesem Workflow nach dem Statuscommit abgeschlossen.",
              "- GitHub-Release: **erfolgreich veröffentlicht**; Asset HomePilot.apk wurde aktualisiert."
          )
          p.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: confirm production release status [skip ci]"
            git push origin HEAD:main
          fi
          git fetch origin main
          git tag -f latest origin/main
          git push origin refs/tags/latest --force
          VERSION_NAME=$(grep -oE 'versionName[[:space:]]*=[[:space:]]*"[^"]+"' app/build.gradle.kts | head -n 1 | cut -d '"' -f2)
          gh release edit latest --notes "HomePilot-Version: $VERSION_NAME
          Automatisch gebaut, signiert und veröffentlicht. Produktionsstatus und Quellstand siehe PROJECT_STATUS.md."
