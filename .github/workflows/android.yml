name: HomePilot Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v4

      - name: Android SDK Pakete installieren
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9 installieren
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Stabilen Debug-Signaturschlüssel einrichten
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode .github/debug-keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Debug APK bauen
        run: gradle --no-daemon assembleDebug

      - name: APK als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: HomePilot-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: APK für direkten Download vorbereiten
        run: cp app/build/outputs/apk/debug/app-debug.apk HomePilot.apk

      - name: Neueste APK als GitHub-Release bereitstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: HomePilot – neueste Version
          body: |
            Automatisch erstellte HomePilot-APK aus dem neuesten erfolgreichen Build.
            Lade HomePilot.apk herunter und installiere sie auf deinem Android-Gerät.
          files: HomePilot.apk
          overwrite_files: true
          make_latest: true
